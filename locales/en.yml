  table_info:
    title: "How to use the table"
    title_full: "How to use the user table"
    description: >-
      The table is used to map <b>Telegram</b> participants to <b>TrueConf</b> users during chat transfer.
      If users are already created on the server, specify <b>Telegram ID</b> and <b>Token</b>,
      or if the token is unavailable, you can use <b>TrueConf ID</b> and <b>Password</b>.
      If users don't exist on the server yet, register them first using the application or manually.
      Registration additionally requires <b>Display name in TrueConf (DN)</b> – the user's display name, while email will be created automatically using the pattern
      <code>trueconf_id@domain</code>. For information on obtaining an <b>access token</b>, see the <a href="https://github.com/TrueConf/telegram-trueconf-migration/blob/main/README-ru.md#%D1%80%D0%B5%D0%B3%D0%B8%D1%81%D1%82%D1%80%D0%B0%D1%86%D0%B8%D1%8F-%D0%BF%D0%BE%D0%BB%D1%8C%D0%B7%D0%BE%D0%B2%D0%B0%D1%82%D0%B5%D0%BB%D0%B5%D0%B9-%D0%B2-trueconf-server">documentation</a>.

